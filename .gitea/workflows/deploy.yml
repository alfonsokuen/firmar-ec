# Pipeline de deploy-en-merge — firmar.ec (landing Astro, monorepo pnpm)
#
# FASE 3 (idkpublicitaria gitConnectors): PROMOVIDO a push:[main] 2026-07-22
# tras corrida manual verde (run exitoso 2026-07-21 03:11 UTC, ver commit
# e8ed90f). `deployStatusContext: "deploy/prod"` ya se agregó en
# idkpublicitaria/src/config/gitConnectors.ts para esta propiedad.
#
# Derivado de la plantilla idkmanager-web/.gitea/workflows/deploy.yml y del
# deploy manual real scripts/deploy-landing.sh (que sigue existiendo como
# fallback si el runner está caído). Diferencias clave vs el script manual: el
# runner YA corre en IAS01 (label firmarec-prod, host-mode), así que no hay
# tar/scp/ssh — se clona y buildea in-situ. Tag = sha del commit (idempotente),
# no la versión de package.json.
#
# Requiere: act_runner host-mode en el nodo manager con label `firmarec-prod`,
# git + docker en PATH, socket docker del manager y acceso al registry interno.
# Cero secretos nuevos: solo el token efímero de job (${{ secrets.GITEA_TOKEN }}).
#
# Las coordenadas de la infraestructura (`vars.REGISTRY`, `vars.ORIGIN_IP`) NO
# viven en este fichero: se configuran como variables del repo en Gitea. Este
# repo tiene un espejo PUBLICO en GitHub, y tenerlas aqui equivalia a publicar
# donde vive la infraestructura. El paso "Guard coordenadas" falla temprano y
# con un mensaje claro si faltan, en vez de construir un nombre de imagen roto.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # deploys se serializan, nunca se cancelan en curso

jobs:
  deploy:
    runs-on: firmarec-prod
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      ORIGIN_IP: ${{ vars.ORIGIN_IP }}
      # Host publico de la PWA y URL de la tienda que Vite inlina en build.
      # Aqui y no incrustados en los pasos: son lo unico que cambiaria al
      # levantar el stack en otro entorno.
      PWA_HOST: app.firmar.ec
      STORE_URL: https://tienda.firmar.ec

    steps:
      # --- 0. Guard: prod solo desde main -----------------------------------
      - name: Guard rama
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "RECHAZADO: deploy a prod solo desde main (ref actual: ${{ github.ref_name }})" >&2
            exit 1
          fi

      # Sin esto, unas variables ausentes producirian un nombre de imagen
      # malformado ("/firma-ec-landing:sha") y el fallo aparecería varios pasos
      # despues, disfrazado de error de docker.
      - name: Guard coordenadas
        run: |
          set -euo pipefail
          : "${REGISTRY:?falta la variable de repo REGISTRY (Settings -> Actions -> Variables)}"
          : "${ORIGIN_IP:?falta la variable de repo ORIGIN_IP (Settings -> Actions -> Variables)}"
          echo "coordenadas presentes"

      # --- 1. Checkout manual (host-mode, sin node → sin actions/checkout) ---
      - name: Clonar repo (git plano)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # NO rm -rf del workspace (es el cwd del step en host-mode); vaciar contenido.
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://token:${{ secrets.GITEA_TOKEN }}@${GITEA_SERVER_HOST:-git.idkmanager.com}/alfonso/firmar-ec.git" \
            "$GITHUB_WORKSPACE"
          # Purgar el token: git lo persiste en claro en .git/config y el runner
          # host-mode no tiene FS efímero.
          git -C "$GITHUB_WORKSPACE" remote set-url origin \
            "https://${GITEA_SERVER_HOST:-git.idkmanager.com}/alfonso/firmar-ec.git"
          git rev-parse HEAD

      - name: Calcular TAG determinista (short sha)
        id: tag
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TAG="sha-$(git rev-parse --short=12 HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG"

      # --- 2. Build (mismo Dockerfile que el deploy manual) -------------------
      - name: docker build
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/firma-ec-landing:${{ steps.tag.outputs.tag }}"
          # PUBLIC_STORE_URL: mismo default que scripts/deploy-landing.sh (CTA
          # cruzados firma→tienda; Astro lo inlina en build).
          docker build \
            --build-arg PUBLIC_STORE_URL="https://tienda.firmar.ec" \
            -f infra/docker/landing.Dockerfile \
            -t "$IMG" .

      # --- 3. Smoke PRE-deploy de la imagen (antes de pushear) ----------------
      - name: Smoke pre-deploy (contenedor efímero)
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/firma-ec-landing:${{ steps.tag.outputs.tag }}"
          CID=$(docker run -d -P "$IMG")
          cleanup() { docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          PORT=$(docker port "$CID" 8080/tcp | head -n1 | sed -E 's/.*:([0-9]+)$/\1/')
          [ -n "$PORT" ] || { echo "no se resolvió el puerto mapeado" >&2; exit 1; }

          OK=0
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/" || echo 000)
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" -ne 1 ]; then
            echo "home no respondió 200 en la imagen recién construida" >&2
            docker logs "$CID" || true
            exit 1
          fi

          # Los 3 artefactos que el smoke del deploy manual verifica en vivo
          # (Caddy sirve el dist en /srv). Verificarlos DENTRO de la imagen
          # evita pushear un build que los perdió (gotcha 2026-05-23: sitemap
          # stale por extract sucio — aquí el build es siempre desde clone limpio).
          for f in llms.txt llms-full.txt .well-known/ai-plugin.json; do
            docker run --rm "$IMG" ls "/srv/$f" >/dev/null 2>&1 \
              || { echo "$f ausente en /srv dentro de la imagen" >&2; exit 1; }
          done
          echo "Smoke pre-deploy OK"

      # --- 4. Push al registry interno ----------------------------------------
      - name: docker push
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/firma-ec-landing:${{ steps.tag.outputs.tag }}"

      # --- 5. Deploy: service update (igual que el deploy manual, NO stack deploy)
      - name: docker service update firma-ec_landing
        run: |
          set -euo pipefail
          # Mismos flags que scripts/deploy-landing.sh: start-first (zero-downtime).
          # --force se omite: el tag sha-X es nuevo en cada commit, el update
          # siempre tiene delta real.
          docker service update \
            --image "${REGISTRY}/firma-ec-landing:${{ steps.tag.outputs.tag }}" \
            --update-order start-first \
            --with-registry-auth \
            firma-ec_landing

      # --- 6. Esperar convergencia ---------------------------------------------
      - name: Esperar convergencia del rolling update
        run: |
          set -euo pipefail
          SERVICE="firma-ec_landing"
          TARGET_TAG="${{ steps.tag.outputs.tag }}"
          DESIRED=$(docker service inspect "$SERVICE" --format '{{ if .Spec.Mode.Replicated }}{{ .Spec.Mode.Replicated.Replicas }}{{ else }}1{{ end }}')
          echo "Esperando $DESIRED réplicas Running en :$TARGET_TAG"
          DEADLINE=$((SECONDS + 300))
          RUNNING_NEW=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATE=$(docker service inspect "$SERVICE" --format '{{ if .UpdateStatus }}{{ .UpdateStatus.State }}{{ end }}' 2>/dev/null || echo "")
            case "$STATE" in
              rolled_back) echo "Swarm auto-revirtió (healthcheck falló)" >&2; exit 1 ;;
              paused)      echo "Update PAUSED — estado inconsistente, acción humana" >&2; exit 1 ;;
            esac
            RUNNING_NEW=$(docker service ps "$SERVICE" --filter desired-state=running \
              --format '{{ .CurrentState }}|{{ .Image }}' 2>/dev/null \
              | grep '^Running' | grep -Fc ":$TARGET_TAG" || true)
            if [ "${RUNNING_NEW:-0}" -ge "$DESIRED" ]; then
              echo "Convergido: $RUNNING_NEW/$DESIRED réplicas en la imagen nueva"; exit 0
            fi
            sleep 5
          done
          echo "Timeout (5 min): ${RUNNING_NEW:-0}/$DESIRED réplicas en la imagen nueva" >&2
          exit 1

      # --- 7. Smoke POST-deploy vía Traefik + rollback explícito si falla -------
      - name: Smoke post-deploy (HTTPS origen)
        run: |
          set -uo pipefail   # NO -e: capturamos el fallo para revertir
          HOST="firmar.ec"
          SERVICE="firma-ec_landing"

          check() {
            local path="$1" url="https://${HOST}${1}" body status
            # --resolve al Traefik local: probamos el ORIGEN recién desplegado,
            # no la cache de Cloudflare (misma razón que la plantilla idkmanager-web).
            # -k: el origen de firmar.ec sirve el cert autofirmado por defecto
            # de Traefik para este host (verificado 2026-07-20, sin certresolver
            # propio) — Cloudflare está en modo Full (no Full Strict), así que
            # el tráfico real de usuarios ya tolera esto mismo; validar TLS
            # estricto aquí solo produciría un falso rojo + rollback de un
            # deploy sano (confirmado en vivo: primer workflow_dispatch real).
            body=$(curl -k --resolve "${HOST}:443:${ORIGIN_IP}" --compressed -sS -w '\n%{http_code}' "$url" 2>/dev/null) || { echo "curl error de red para $url" >&2; return 1; }
            status=$(echo "$body" | tail -n1)
            [ "$status" = "200" ] || { echo "GET $url → HTTP $status (esperado 200)" >&2; return 1; }
            echo "GET $url → 200 OK"
          }

          # Mismos paths que el smoke del deploy manual + el home.
          # NOTA: la imagen NO tiene sello BUILD_SHA (el Dockerfile de la landing
          # no lo soporta aún) → este smoke prueba que el sitio sirve, no que la
          # réplica servida ES este build; el converge (paso 6) cubre eso.
          SMOKE_OK=0
          for attempt in $(seq 1 15); do
            if check "/" && check "/llms.txt" && check "/llms-full.txt" && check "/.well-known/ai-plugin.json"; then
              echo "Smoke post-deploy OK [intento $attempt]"; SMOKE_OK=1; break
            fi
            echo "smoke intento $attempt falló; reintento en 10s..." >&2
            sleep 10
          done

          if [ "$SMOKE_OK" -ne 1 ]; then
            echo "Smoke post-deploy FALLÓ tras 15 intentos — revirtiendo $SERVICE" >&2
            docker service rollback "$SERVICE" \
              && echo "Rollback explícito completado" >&2 \
              || echo "ATENCIÓN: rollback devolvió error — revisar a mano" >&2
            exit 1
          fi

      # === PWA ==================================================================
      # Hasta el 2026-08-24 este workflow desplegaba SOLO la landing y la PWA
      # salia a mano con scripts/deploy-pwa.sh. Consecuencia real ese mismo dia:
      # se mergeo el PR que traia el embudo de instalacion, el deploy dio verde,
      # y produccion siguio sirviendo el build del dia anterior — lo destapo un
      # e2e en vivo, no el pipeline.
      #
      # Se etiqueta con el MISMO sha-<short12> que la landing, no con la version
      # de package.json, por dos razones: (1) desplegar con una etiqueta que ya
      # corre es un no-op silencioso en Swarm, y (2) reusar una etiqueta semver
      # ya publicada la sobrescribe en el registro y el rollback deja de apuntar
      # a lo que se probo. La version que ve el usuario sigue viniendo de
      # package.json inyectada en build (__APP_VERSION__), independiente del tag.

      - name: docker build (pwa)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/firma-ec-pwa:${{ steps.tag.outputs.tag }}"
          # Mismos build-args que scripts/deploy-pwa.sh. VITE_HANDOFF_ALLOWLIST
          # se deja VACIA a proposito: el allow-list es fail-closed y el handoff
          # lo sirve su propio servicio (firma-ec_pwa_handoff), no este.
          docker build \
            --build-arg VITE_HANDOFF_ALLOWLIST="" \
            --build-arg VITE_STORE_URL="${STORE_URL}" \
            --build-arg VITE_WHATSAPP_URL="" \
            -f infra/docker/pwa.Dockerfile \
            -t "$IMG" .

      - name: Smoke pre-deploy pwa (contenedor efimero)
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/firma-ec-pwa:${{ steps.tag.outputs.tag }}"
          CID=$(docker run -d -P "$IMG")
          cleanup() { docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          PORT=$(docker port "$CID" 8080/tcp | head -n1 | sed -E 's/.*:([0-9]+)$/\1/')
          [ -n "$PORT" ] || { echo "no se resolvio el puerto mapeado" >&2; exit 1; }
          BASE="http://127.0.0.1:${PORT}"

          OK=0
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/" || echo 000)
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 2
          done
          [ "$OK" -eq 1 ] || { echo "home no respondio 200 en la imagen recien construida" >&2; docker logs "$CID" || true; exit 1; }

          # GOTCHA (2026-08-23): esta app sirve un catch-all SPA, asi que una ruta
          # de asset INEXISTENTE devuelve 200 con text/html. Un smoke que solo
          # mire %{http_code} pasa en VERDE con el worker de PDF.js roto — que es
          # exactamente el bug que mato la firma en 22 escenarios e2e. Los assets
          # criticos se afirman por CONTENT-TYPE, y el catch-all se prueba al
          # final: sin ese control negativo, los verdes de arriba no dicen nada.
          # `--compressed` NO es cosmetico. Caddy no tiene MIME para .pfb: si el
          # cliente no acepta compresion sirve el fichero crudo SIN Content-Type,
          # y si la acepta sirve el .pfb.br precomprimido CON
          # application/octet-stream. Todo cliente real (navegador, fetch de
          # PDF.js) manda Accept-Encoding, asi que pedir sin el probaba una
          # configuracion que no usa nadie — y tumbaba el deploy en falso.
          # Medido en la imagen 0.23.0 el 2026-08-24.
          check_type() {
            path="$1"; want="$2"
            out=$(curl -sS --compressed -o /dev/null -w '%{http_code} %{content_type}' "$BASE/$path" || echo 'FAIL -')
            code=${out%% *}; ctype=${out#* }
            [ "$code" = "200" ] || { echo "  $path -> $code [FALLO: se esperaba 200]" >&2; return 1; }
            case "$ctype" in
              *"$want"*) echo "  $path -> $code $ctype" ;;
              *) echo "  $path -> $code $ctype [FALLO: se esperaba content-type $want]" >&2; return 1 ;;
            esac
          }

          check_type "manifest.webmanifest" "json"
          check_type "trust/tsl-ec.json" "json"
          check_type "pdfjs/pdf.worker.min.mjs" "javascript"
          check_type "pdfjs/standard_fonts/FoxitSerif.pfb" "octet-stream"

          NEG=$(curl -sS --compressed -o /dev/null -w '%{content_type}' "$BASE/pdfjs/__no-existe-$$.mjs" || echo '-')
          case "$NEG" in
            *html*) echo "  control negativo OK (ruta inexistente -> $NEG, por eso se afirma el tipo)" ;;
            *) echo "el control negativo devolvio '$NEG', no HTML: la premisa del smoke cambio" >&2; exit 1 ;;
          esac
          echo "Smoke pre-deploy pwa OK"

      - name: docker push (pwa)
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/firma-ec-pwa:${{ steps.tag.outputs.tag }}"

      - name: docker service update firma-ec_pwa
        run: |
          set -euo pipefail
          # --force se omite igual que en la landing: el tag sha-X es nuevo en
          # cada commit, asi que el update SIEMPRE tiene delta real.
          docker service update \
            --image "${REGISTRY}/firma-ec-pwa:${{ steps.tag.outputs.tag }}" \
            --update-order start-first \
            --with-registry-auth \
            firma-ec_pwa

      - name: Esperar convergencia del rolling update (pwa)
        run: |
          set -euo pipefail
          SERVICE="firma-ec_pwa"
          TARGET_TAG="${{ steps.tag.outputs.tag }}"
          DESIRED=$(docker service inspect "$SERVICE" --format '{{ if .Spec.Mode.Replicated }}{{ .Spec.Mode.Replicated.Replicas }}{{ else }}1{{ end }}')
          echo "Esperando $DESIRED replicas Running en :$TARGET_TAG"
          DEADLINE=$((SECONDS + 300))
          RUNNING_NEW=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATE=$(docker service inspect "$SERVICE" --format '{{ if .UpdateStatus }}{{ .UpdateStatus.State }}{{ end }}' 2>/dev/null || echo "")
            case "$STATE" in
              rolled_back) echo "Swarm auto-revirtio (healthcheck fallo)" >&2; exit 1 ;;
              paused)      echo "Update PAUSED — estado inconsistente, accion humana" >&2; exit 1 ;;
            esac
            # Contar TAREAS en la imagen nueva, no '.Replicas': leer las replicas
            # justo tras lanzar el update devuelve el estado ANTERIOR y da el
            # despliegue por bueno a mitad del rollout (costo real: 2026-08-24).
            RUNNING_NEW=$(docker service ps "$SERVICE" --filter desired-state=running \
              --format '{{ .CurrentState }}|{{ .Image }}' 2>/dev/null \
              | grep '^Running' | grep -Fc ":$TARGET_TAG" || true)
            if [ "${RUNNING_NEW:-0}" -ge "$DESIRED" ]; then
              echo "Convergido: $RUNNING_NEW/$DESIRED replicas en la imagen nueva"; exit 0
            fi
            sleep 5
          done
          echo "Timeout (5 min): ${RUNNING_NEW:-0}/$DESIRED replicas en la imagen nueva" >&2
          exit 1

      - name: Smoke post-deploy pwa (HTTPS origen)
        run: |
          set -uo pipefail   # NO -e: capturamos el fallo para revertir
          HOST="${PWA_HOST}"
          SERVICE="firma-ec_pwa"

          # Mismo razonamiento -k que la landing: el origen sirve el cert por
          # defecto de Traefik para este host y Cloudflare va en modo Full.
          check_type() {
            path="$1"; want="$2"
            out=$(curl -k --resolve "${HOST}:443:${ORIGIN_IP}" --compressed -sS -o /dev/null -w '%{http_code} %{content_type}' "https://${HOST}/${path}" 2>/dev/null || echo 'FAIL -')
            code=${out%% *}; ctype=${out#* }
            [ "$code" = "200" ] || { echo "  /$path -> $code [esperado 200]" >&2; return 1; }
            case "$ctype" in
              *"$want"*) echo "  /$path -> $code $ctype" ;;
              *) echo "  /$path -> $code $ctype [esperado content-type $want]" >&2; return 1 ;;
            esac
          }

          SMOKE_OK=0
          for attempt in $(seq 1 15); do
            if check_type "" "html" \
               && check_type "manifest.webmanifest" "json" \
               && check_type "pdfjs/pdf.worker.min.mjs" "javascript"; then
              NEG=$(curl -k --resolve "${HOST}:443:${ORIGIN_IP}" --compressed -sS -o /dev/null -w '%{content_type}' "https://${HOST}/pdfjs/__no-existe-$$.mjs" 2>/dev/null || echo '-')
              case "$NEG" in
                *html*) echo "Smoke post-deploy pwa OK [intento $attempt]"; SMOKE_OK=1; break ;;
                *) echo "control negativo devolvio '$NEG', no HTML — premisa rota" >&2 ;;
              esac
            fi
            echo "smoke pwa intento $attempt fallo; reintento en 10s..." >&2
            sleep 10
          done

          if [ "$SMOKE_OK" -ne 1 ]; then
            echo "Smoke post-deploy pwa FALLO tras 15 intentos — revirtiendo $SERVICE" >&2
            docker service rollback "$SERVICE" \
              && echo "Rollback explicito completado" >&2 \
              || echo "ATENCION: rollback devolvio error — revisar a mano" >&2
            exit 1
          fi

          # --- Un 404 bajo /assets/ NO puede ser cacheable -------------------
          # La politica de cache se aplica por RUTA y Caddy la evalua ANTES de
          # saber si el fichero existe, asi que el `immutable, max-age=1 ano` de
          # los chunks acompanaba tambien al 404. En un rolling update
          # start-first la peticion al chunk NUEVO cae a veces en la replica
          # VIEJA: ese 404 se cacheo un ANO en el edge y dejo la app en blanco
          # (deploy de la 0.26.0, 2026-09-09).
          #
          # Va FUERA del bucle y NO dispara rollback, a proposito:
          #  - es una propiedad de la config horneada en la imagen, no un estado
          #    que converja: reintentarla 15 veces no la cambia;
          #  - revertir seria otro rolling update start-first, es decir volver a
          #    generar los 404 que envenenan: la cura reproduciendo el dano.
          # Se afirma en POSITIVO (exigir no-store) y el cajon de sastre es
          # ROJO: un curl fallido deja la variable vacia, y "no pude medirlo"
          # jamas puede leerse como "esta bien".
          CC404=$(curl -k --resolve "${HOST}:443:${ORIGIN_IP}" --compressed -sS --max-time 15 -D- -o /dev/null "https://${HOST}/assets/__no-existe-$$-abcdef12.js" 2>/dev/null | tr -d '\015' | awk 'tolower($1)=="cache-control:"{$1=""; print tolower($0)}' || echo 'CURL-FAIL')
          [ -n "$CC404" ] || CC404='SIN-CABECERA-O-NO-MEDIDO'
          case "$CC404" in
            *no-store*|*no-cache*)
              echo "  404 de /assets no cacheable ($CC404)" ;;
            *)
              echo "  404 de /assets: Cache-Control='$CC404' - cacheable o NO medido." >&2
              echo "  El servicio queda desplegado y sirviendo; NO se revierte (ver comentario)." >&2
              exit 1 ;;
          esac

      # --- 8. Commit status en Gitea ---------------------------------------------
      - name: Reportar commit status (success)
        if: success()
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${GITEA_SERVER_URL:-https://git.idkmanager.com}/api/v1/repos/alfonso/firmar-ec/statuses/${{ steps.tag.outputs.sha || github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"deploy/prod\",\"description\":\"firma-ec_landing + firma-ec_pwa desplegados en ${{ steps.tag.outputs.tag }}\"}"

      - name: Reportar commit status (failure)
        if: failure()
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${GITEA_SERVER_URL:-https://git.idkmanager.com}/api/v1/repos/alfonso/firmar-ec/statuses/${{ steps.tag.outputs.sha || github.sha }}" \
            -d "{\"state\":\"failure\",\"context\":\"deploy/prod\",\"description\":\"deploy pipeline failed — revisar logs\"}"
