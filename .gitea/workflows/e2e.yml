# Gate de E2E (Playwright) sobre PULL REQUESTS — firma.ec PWA
#
# POR QUÉ EXISTE ESTE ARCHIVO
# `.github/workflows/ci.yml` tiene un job `e2e` equivalente, pero SOLO corre
# en los espejos de GitHub (`gh-idk`, `gh-personal`) — Gitea Actions ignora
# `.github/workflows/*` por completo en cuanto `.gitea/workflows/` existe
# (que ya existe: `deploy.yml` + `pr-check.yml`), así que ese job nunca se
# ejecuta en `origin` (git.idkmanager.com), que es el remoto real donde se
# mergea a `main` y desde donde `deploy.yml` despliega a producción.
# Confirmado (2026-08-07, dual review Fable+Opus del propio job de GitHub):
# hallazgo HIGH — "el gate nuevo no corre en el remoto donde se fusiona y se
# despliega". Este archivo lo cierra en el remoto que de verdad importa.
#
# Mismo runner y mismo patrón de seguridad que `pr-check.yml` (leer su
# cabecera para el razonamiento completo): self-hosted `firmarec-prod`,
# host-mode con el socket docker del manager Swarm — efectivamente root en
# IAS01. El fork-guard de abajo es defensa en profundidad, NO el control
# primario (ver `pr-check.yml`); el control primario vive en configuración
# de Gitea (Settings → Actions → runs de forks), fuera de este repo.
#
# QUÉ CORRE Y CÓMO
# La suite Playwright de `apps/pwa` es hermética (fixtures P12 efímeras
# generadas en caliente, AIA/TSA mockeados vía middleware dev-only, cero red
# externa real — ver `apps/pwa/tests/e2e/global-setup.ts` y
# `apps/pwa/vite.config.ts`). Corre dentro de la imagen oficial de Playwright
# (Node + Chromium + deps del SO ya resueltas, versión pineada exacta al
# lockfile — `mcr.microsoft.com/playwright:v1.59.1-jammy`), con el checkout
# MONTADO como bind volume en vez de copiado a una imagen nueva: evita por
# completo la trampa del `.dockerignore` raíz (excluye `**/tests` a
# propósito para `landing.Dockerfile`/`pwa.Dockerfile`, que empaquetan
# producción — aquí SÍ hace falta `apps/pwa/tests/`) y no exige mantener un
# Dockerfile propio, solo `docker pull` de una imagen pública versionada.
#
# ⚠️ NO BLOQUEANTE A PROPÓSITO (dual review 2026-08-07, hallazgo HIGH #2):
# 2 corridas completas locales de esta suite dieron 3/57 tests rojos cada
# vez, con un conjunto DISTINTO de tests fallando en cada corrida — flakiness
# de timing/carga preexistente en la suite, no causada por ningún cambio
# reciente. Promover una suite ya roja y no determinista a gate duro
# bloquearía PRs ajenos por fallos que no les competen. Por eso este archivo
# **nunca llama a la API de commit-status de Gitea** (a diferencia de
# `pr-check.yml`, que sí postea `ci/pr-check` porque ESE job es el gate
# duro que activa idkpublicitaria vía `getPullCiStatus` sobre el ESTADO
# COMBINADO de todos los contextos de un sha — postear aquí un contexto que
# sabemos que a veces reportará `failure` habría inflado ese combinado a
# rojo y bloqueado el auto-merge de SEO sin que ésa fuera la intención).
# El resultado de esta corrida queda visible solo en la pestaña Actions de
# Gitea, para revisión humana — no como gate.
#
# CRITERIO DE PROMOCIÓN A GATE DURO (fijado 2026-08-23, tras cerrar la causa
# raíz de los 22 fallos del container-run): 5 corridas CONSECUTIVAS en verde
# sobre PRs reales (no reproducciones manuales), sin re-runs necesarios para
# limpiar el verde. Antes de contar la primera:
#   1. `firmar-lote-propagacion.spec.ts` (PDF de 22.000 páginas, ya señalado
#      flaky en PR #3 2026-08-07) y `tsa-flow.spec.ts` (timeout en
#      `.box-overlay`, mismo PR) deben aislarse (project separado, fuera del
#      conteo) o arreglarse — de lo contrario el criterio nunca se cumple.
#   2. Resolver el acoplamiento con el gate de auto-merge de idkpublicitaria
#      documentado abajo (el status nativo de Gitea SÍ entra al combinado que
#      lee `getPullCiStatus`): antes de subir a gate duro, decidir si este
#      contexto se excluye de ese combinado o se marca no-requerido en
#      Settings → Branches — si no, una corrida roja de e2e bloquearía merges
#      de SEO sin relación con este repo.
# Sin este número, "esperar una ventana real" se pudre en permanente.
#
# 🔴 CONFIRMADO en la primera PR real (#3, 2026-08-07): Gitea Actions SÍ
# postea un commit-status NATIVO propio para este job (`context: "e2e / e2e
# (pull_request)"`), sin que este workflow llame nunca a la API manual. El
# intento de "no bloqueante por ausencia de status" de más arriba NO se
# cumple como estaba diseñado — el contexto nativo entra igual al estado
# COMBINADO que lee `getPullCiStatus` de idkpublicitaria, y este repo SÍ
# tiene conector de idkpublicitaria (`gitea_idkpub_connector_firmarec_bot`,
# colaborador write en `alfonso/firmar-ec`). Si ese auto-merge está activo
# para este repo, una corrida roja de esta suite (flaky, ver arriba) SÍ
# puede inflar el combinado y bloquear un merge de SEO que no tiene nada
# que ver. Mitigación NO implementada aquí a propósito (requiere tocar
# Settings → Branches de Gitea o el gate de idkpublicitaria, otro sistema —
# decisión explícita del usuario, no de este archivo): candidatos son (a)
# excluir el contexto `e2e / e2e` en `getPullCiStatus`, o (b) marcarlo
# explícitamente como NO requerido en Settings → Branches si Gitea permite
# esa distinción por contexto individual.
#
# ⚠️ NUNCA interpolar `${{ ... }}` de PAYLOAD dentro de un `run:` — ver
# `pr-check.yml` para la explicación completa (rama con `"`, `;`, `$`, etc.
# ejecutaría código en un runner con acceso root efectivo a IAS01). Todo
# valor del evento entra por `env:` y se usa entrecomillado. Invariante
# verificable: ningún `step.run` de este archivo contiene la subcadena `${{`.
#
# ⚠️ Workspace propio (`$E2ECHECK_DIR`), NO `$GITHUB_WORKSPACE` — mismo
# motivo que `pr-check.yml`: ese directorio lo comparte `deploy.yml` y
# ambos hacen `find -delete`; con workspaces separados la propiedad se
# cumple por construcción.

name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: firmarec-prod
    # No bloqueante (mismo criterio y motivo que `.github/workflows/ci.yml`):
    # la primera corrida completa que llegó a ejecutar la suite entera (PR #3,
    # 2026-08-07, 25m15s) SÍ terminó -- y falló por un test ya documentado
    # como flaky preexistente (`tsa-flow.spec.ts`, timeout esperando
    # `.box-overlay`), no por nada de este PR. Sin `continue-on-error`, cada
    # corrida flaky marca este job "failure" de verdad, lo que alimenta el
    # status nativo que Gitea postea igual (ver cabecera del archivo) y de
    # ahí al combinado que lee el gate de auto-merge de idkpublicitaria.
    continue-on-error: true
    # 35 min NO alcanzó en la primera corrida real (PR #3, 2026-08-07): el
    # pull en frío de mcr.microsoft.com/playwright:v1.59.1-jammy tardó ~12min
    # (ancho de banda del runner hacia MCR, no un bug), dejando solo ~23min
    # para pnpm install + playwright test -- expiró con "context deadline
    # exceeded" antes de que el contenedor imprimiera una sola línea (ver
    # streaming de logs más abajo, agregado por el mismo motivo: hasta ahora
    # el job era una caja negra mientras corría). El pull en frío es un costo
    # de UNA sola vez por runner -- una vez cacheada la imagen localmente,
    # las corridas siguientes deberían saltárselo. 45min deja margen para un
    # pull en frío completo (con el runner ya lento) + install + test.
    timeout-minutes: 45

    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      THIS_REPO: ${{ github.repository }}
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITEA_HOST: git.idkmanager.com

    steps:
      # --- 0. Validar procedencia ANTES de tocar nada (ver pr-check.yml) -------
      - name: Validar procedencia y head sha
        run: |
          set -euo pipefail

          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "PR desde un repo externo ($HEAD_REPO) — no se construye en este runner" >&2
            exit 1
          fi

          case "$HEAD_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "head.sha ausente o con forma inesperada: '$HEAD_SHA'" >&2; exit 1 ;;
          esac

          E2ECHECK_DIR="$(cd "$GITHUB_WORKSPACE/.." && pwd)/e2echeck-$HEAD_SHA"
          mkdir -p "$E2ECHECK_DIR"
          echo "E2ECHECK_DIR=$E2ECHECK_DIR" >> "$GITHUB_ENV"

          echo "E2E de $HEAD_SHA (rama $HEAD_REF) en $E2ECHECK_DIR"

      # --- 1. Checkout EXACTO del head sha -------------------------------------
      - name: Clonar y posicionarse en el head sha
        working-directory: ${{ env.E2ECHECK_DIR }}
        run: |
          set -euo pipefail
          find "$E2ECHECK_DIR" -mindepth 1 -delete 2>/dev/null || true

          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: token $GITEA_TOKEN" \
            git clone --depth 20 --branch "$HEAD_REF" \
              "https://$GITEA_HOST/$THIS_REPO.git" "$E2ECHECK_DIR"

          if ! git -C "$E2ECHECK_DIR" checkout --quiet "$HEAD_SHA"; then
            echo "El head sha $HEAD_SHA ya no está en la rama (la rama avanzó) — este run queda obsoleto" >&2
            exit 1
          fi
          echo "HEAD real: $(git -C "$E2ECHECK_DIR" rev-parse HEAD)"

      # --- 2. Correr la suite dentro de la imagen oficial de Playwright --------
      # Checkout MONTADO (-v), no copiado a una imagen — ver cabecera del
      # archivo. `--project=chromium` por el mismo motivo que en
      # `.github/workflows/ci.yml`: `test:e2e` corre TODOS los proyectos.
      - name: E2E tests (chromium, dentro de contenedor Playwright)
        working-directory: ${{ env.E2ECHECK_DIR }}
        run: |
          set -euo pipefail
          IMG="mcr.microsoft.com/playwright:v1.59.1-jammy"

          cleanup() {
            [ -n "${LOGS_PID:-}" ] && kill "$LOGS_PID" >/dev/null 2>&1 || true
            [ -n "${CID:-}" ] && docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          # CID capturado del stdout de `docker run -d`, NO vía --cidfile:
          # docker exige que ese archivo NO exista de antemano y lo rechaza si
          # ya está creado (aunque esté vacío) -- `mktemp` lo crea vacío por
          # definición, así que `--cidfile "$(mktemp)"` falla siempre con
          # "container ID file found" antes de arrancar nada (confirmado en
          # la primera corrida real de este job, 2026-08-07: exit 125 a los
          # 3s). Mismo patrón ya probado en `pr-check.yml`.
          #
          # --memory=4g (subido de 2g, 2026-08-08): la corrida bajo 2g mostró
          # muchos tests fallando con duraciones ~17-18s en specs sin
          # relación entre sí. Con 4g, el stack trace real (retry #2 de un
          # fallo, capturado completo) resultó ser un `TimeoutError:
          # locator.waitFor` genuino esperando `.box-overlay` -- NO un crash
          # de Chromium ni un OOM-kill del servidor de preview (hipótesis
          # descartada: el mismo patrón de fallos persistió idéntico tras
          # doblar la memoria). 22/57 fallaron, 19/57 pasaron, 23.9min --
          # corrida real, no colgada.
          #
          # 2026-08-23 -- CAUSA RAÍZ de los 22 fallos ENCONTRADA Y CERRADA
          # (bajando el trace.zip de una reproducción aislada en IAS01, tal
          # como dejaba apuntado el párrafo anterior): NO eran fuentes ni
          # timing. El dev server de Vite 5+ escanea public/ UNA vez al
          # crearse (server.publicFiles) y el plugin sync-pdfjs-assets
          # copiaba el worker de pdf.js en buildStart, DESPUÉS del escaneo:
          # en un checkout fresco (este contenedor) el GET al worker devolvía
          # el index.html del fallback SPA (200, text/html, 4.3KB -- medido
          # en el trace), el module worker moría y `.box-overlay` no montaba
          # jamás. En el host de desarrollo public/pdfjs/ persiste de
          # corridas anteriores -- por eso allí no se reproducía y aquí era
          # determinista. Fix: la copia se movió a configResolved (corre
          # antes de crear el server) en apps/pwa/vite.config.ts. Verificado
          # en ESTE contenedor: 41 passed / 16 skipped / 0 failed, 2.6min
          # (antes 22 failed / 23.9min). Los límites 4g/4cpus se quedan:
          # inocuos y la corrida es más rápida.
          CID=$(docker run -d \
            --memory=4g --cpus=4 --pids-limit=1024 \
            -v "$E2ECHECK_DIR:/workspace" \
            -w /workspace \
            -e CI=1 \
            "$IMG" \
            sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends libarchive-tools >/dev/null && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @firma-ec/pwa exec playwright test --project=chromium')

          # Streaming en vivo: sin esto, el job es una caja negra mientras
          # corre -- `docker wait` no imprime NADA hasta que el contenedor
          # termina. Confirmado el costo real (2026-08-07): un timeout a los
          # 35min no dejó ver si murió en el pull, en `pnpm install` o en los
          # tests -- el log entero apareció recién al final, y con el job ya
          # cancelado ni eso. `-f` en background; el trap lo mata al salir.
          docker logs -f "$CID" 2>&1 &
          LOGS_PID=$!

          # Sin --rm: necesitamos `docker logs` tras un fallo antes de
          # limpiar (mismo motivo que pr-check.yml no usa --rm en su smoke).
          # `tail -300` aquí es redundante con el streaming de arriba en el
          # camino feliz, pero es la única red si el streaming se cortó.
          if ! docker wait "$CID" | grep -qx 0; then
            echo "La suite E2E falló dentro del contenedor — log completo:" >&2
            docker logs "$CID" 2>&1 | tail -300
            exit 1
          fi
          echo "E2E OK (chromium, dentro de contenedor Playwright)"

      # --- 3. Limpieza del workspace propio (contenedor ya lo maneja el trap) --
      - name: Borrar workspace de check
        if: always()
        run: |
          if [ -n "${E2ECHECK_DIR:-}" ]; then
            rm -rf "$E2ECHECK_DIR" 2>/dev/null || true
          fi
